# ==============================================================================
# BrainTumorAI — Production Nginx Reverse Proxy Configuration
# Target Path: /etc/nginx/sites-available/braintumorai.conf
# Symlinked To: /etc/nginx/sites-enabled/braintumorai.conf
# ==============================================================================

upstream braintumorai_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 4.240.90.28 _;

    # Disable server version disclosure
    server_tokens off;

    # Maximum payload size for high-resolution 4-sequence BraTS MRI + SEG uploads
    client_max_body_size 500M;
    client_body_buffer_size 256k;

    # Long inference timeout configuration (nnUNet ensemble + SynthSeg segmentation)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Gzip Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logging Paths
    access_log /var/log/nginx/braintumorai_access.log;
    error_log /var/log/nginx/braintumorai_error.log warn;

    # Reverse Proxy to Uvicorn Backend
    location / {
        proxy_pass http://braintumorai_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffering settings for smooth file streams and downloads
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_temp_file_write_size 256k;
        proxy_max_temp_file_size 1024m;

        # WebSocket support if required
        proxy_set_header Upgrade $http_upgrade;
    }
}
